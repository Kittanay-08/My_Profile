<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-card">
        <div class="card-header">
            <h1>ข้อมูลนักศึกษา</h1>
        </div>
        <div class="card-body">
            <div class="info-row">
                <span class="info-label">ชื่อ-นามสกุล</span>
                <span class="info-value">นาย กฤตนัย ดอนแสง</span>
            </div>
            <div class="info-row">
                <span class="info-label">รหัสนักศึกษา</span>
                <span class="info-value">671540005006-5</span>
            </div>
            <div class="info-row">
                <span class="info-label">สาขาวิชา</span>
                <span class="info-value">วิศวกรรมคอมพิวเตอร์</span>
            </div>

            <!-- ข้อมูลใหม่ 2 รายการสำหรับข้อ 2 -->
            <div class="info-row">
                <span class="info-label">ชั้นปีการศึกษา</span>
                <span class="info-value">ชั้นปีที่ 3</span>
            </div>
            <div class="info-row">
                <span class="info-label">ความสนใจ</span>
                <span class="info-value">Software Engineering & Web Development</span>
            </div>
        </div>
    </div>
</body>
</html>
